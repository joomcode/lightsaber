apply plugin: 'com.android.library'
apply plugin: 'com.joom.lightsaber.android'

android {
  namespace 'com.joom.lightsaber.nativeirsmoke'
  compileSdk androidCompileSdkVersion

  defaultConfig {
    minSdkVersion androidMinSdkVersion
  }

  compileOptions {
    sourceCompatibility javaVersion
    targetCompatibility javaVersion
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.fromVersion(kotlinLanguageVersion)
    languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.fromVersion(kotlinLanguageVersion)
  }
}

lightsaber {
  processingMode = com.joom.lightsaber.plugin.ProcessingMode.KOTLIN_COMPILER_PLUGIN
}

dependencies {
  testImplementation "junit:junit:$junitVersion"
}
