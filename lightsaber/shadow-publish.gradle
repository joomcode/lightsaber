afterEvaluate {
  def shadowJarTask = tasks.named('shadowJar').get()
  shadowJarTask.archiveClassifier.set('')

  publishing.publications.configureEach { publication ->
    if (publication instanceof MavenPublication) {
      publication.artifacts.clear()
      publication.artifact(shadowJarTask)
      publication.artifact(tasks.named('sourcesJar').get()) {
        classifier = 'sources'
      }
    }
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }
}
