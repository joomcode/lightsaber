import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

apply plugin: 'java'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'idea'
apply plugin: 'com.gradleup.shadow'
apply from: "$rootDir/shadow-common.gradle"
apply from: "$rootDir/publish.gradle"
apply from: "$rootDir/shadow-publish.gradle"

java {
  sourceCompatibility = javaVersion
  targetCompatibility = javaVersion
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.fromVersion(kotlinLanguageVersion)
    languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.fromVersion(kotlinLanguageVersion)
  }
}

mavenPublishing {
  coordinates(project.group.toString(), 'lightsaber-gradle-plugin', project.version.toString())
}

dependencies {
  implementation project(':processor')
  relocate project(':processor')
  implementation "org.jetbrains.kotlin:kotlin-stdlib$kotlinRuntimeVariant:$kotlinVersion"

  compileOnly gradleApi()
  compileOnly "com.android.tools.build:gradle:$androidToolsVersion"
  compileOnly "com.android.tools.build:gradle-api:$androidToolsVersion"
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
  configurations = [project.configurations.runtimeClasspath, project.configurations.relocate]
}

def generatedDir = new File(projectDir, "generated")
def generatedJavaSourcesDir = new File(generatedDir, "main/java")

tasks.register('generateBuildClass') {
  inputs.property('version', version)
  outputs.dir generatedJavaSourcesDir

  doLast {
    def buildClassFile = new File(generatedJavaSourcesDir, "com/joom/lightsaber/plugin/Build.java")
    buildClassFile.parentFile.mkdirs()
    buildClassFile.text = "" +
        "package com.joom.lightsaber.plugin;\n" +
        "\n" +
        "public class Build {\n" +
        "    public static final String VERSION = \"$version\";\n" +
        "}\n"
  }
}

sourceSets {
  main {
    java.srcDirs += generatedJavaSourcesDir
  }
}

tasks.matching { it instanceof AbstractCompile || it instanceof KotlinCompile }.configureEach {
  dependsOn tasks.generateBuildClass
}

project.afterEvaluate {
  tasks.named(sourceSets.main.getSourcesJarTaskName()).configure {
    dependsOn tasks.generateBuildClass
  }
}

clean.doFirst {
  delete generatedDir
}

idea {
  module {
    generatedSourceDirs += generatedJavaSourcesDir
  }
}
