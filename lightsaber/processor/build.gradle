apply plugin: 'java'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'application'
apply plugin: 'com.gradleup.shadow'
apply from: "$rootDir/shadow-common.gradle"
apply from: "$rootDir/publish.gradle"
apply from: "$rootDir/shadow-publish.gradle"

java {
  sourceCompatibility = javaVersion
  targetCompatibility = javaVersion
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.fromVersion(kotlinLanguageVersion)
    languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.fromVersion(kotlinLanguageVersion)
  }
}

application {
  mainClass = 'com.joom.lightsaber.processor.LightsaberProcessor'
}

mavenPublishing {
  coordinates(project.group.toString(), 'lightsaber-processor', project.version.toString())
}

dependencies {
  implementation project(':core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib$kotlinRuntimeVariant:$kotlinVersion"

  implementation "io.michaelrocks.bimap:bimap:$bimapVersion"
  implementation "ch.qos.logback:logback-classic:$logbackVersion"

  relocate "org.ow2.asm:asm:$asmVersion"
  relocate "org.ow2.asm:asm-commons:$asmVersion"
  relocate "com.joom.grip:grip:$gripVersion"

  testImplementation "org.mockito.kotlin:mockito-kotlin:$mockitoKotlinVersion"
  testImplementation "junit:junit:$junitVersion"
  testImplementation "org.jetbrains.kotlin:kotlin-compiler:$kotlinVersion"
}

shadow {
  addShadowVariantIntoJavaComponent = false
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
  configurations = [project.configurations.runtimeClasspath, project.configurations.relocate]
  relocate('com.joom.grip', 'com.joom.lightsaber.grip')
  relocate('org.objectweb.asm', 'com.joom.lightsaber.asm')
}
